<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Manage Orders — Shenu Admin</title>
  <link rel="stylesheet" href="../../css/main.css?v=26" />
  <link rel="stylesheet" href="../../css/components.css" />
  <link rel="stylesheet" href="../../css/pages.css?v=3" />
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23C9A96E'/><text y='22' x='6' font-size='20' font-family='serif' font-weight='bold' fill='%230F0F1A'>S</text></svg>" />
  <!-- Immediate Theme Pre-loader -->
  <script>
    (function() {
      try {
        var t = localStorage.getItem('shenu_theme') || 'dark';
        document.documentElement.setAttribute('data-theme', t);
      } catch(e) {}
    })();
    window.toggleTheme = function() {
      try {
        var cur = document.documentElement.getAttribute('data-theme') || 'dark';
        var nxt = cur === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', nxt);
        if (document.body) document.body.setAttribute('data-theme', nxt);
        try { localStorage.setItem('shenu_theme', nxt); } catch(e) {}
        if (typeof window.updateThemeIcons === 'function') {
          window.updateThemeIcons(nxt);
        } else {
          document.querySelectorAll('.theme-icon-sun').forEach(function(i) { i.style.display = nxt === 'light' ? 'none' : 'inline-block'; });
          document.querySelectorAll('.theme-icon-moon').forEach(function(i) { i.style.display = nxt === 'light' ? 'inline-block' : 'none'; });
        }
        if (typeof window.showToast === 'function') {
          showToast((nxt === 'light' ? '☀️ Light Mode' : '🌙 Dark Mode') + ' Activated', 'info');
        }
      } catch(e) { console.error('Theme toggle error:', e); }
    };
  </script>
  <link rel="stylesheet" href="../../css/chatbot.css?v=115" />
</head>
<body>
  <div id="toast-container"></div>

  <div class="admin-layout">
    <aside class="admin-sidebar">
      <div class="admin-sidebar-logo">
        <a href="../../index.html" class="navbar-logo">
          <div class="navbar-logo-icon">S</div>
          <div class="navbar-logo-text">SHENU <span>ADMIN</span></div>
        </a>
      </div>
      <nav class="admin-nav">
        <div class="admin-nav-group">
          <a href="dashboard.html" class="admin-nav-item"><i data-lucide="layout-dashboard" width="18" height="18"></i> Dashboard</a>
          <a href="products.html" class="admin-nav-item"><i data-lucide="shirt" width="18" height="18"></i> Products</a>
          <a href="orders.html" class="admin-nav-item active"><i data-lucide="package" width="18" height="18"></i> Orders</a>
          <a href="users.html" class="admin-nav-item"><i data-lucide="users" width="18" height="18"></i> Customers</a>
          <a href="../../index.html" class="admin-nav-item"><i data-lucide="store" width="18" height="18"></i> View Store</a>
          <button class="admin-nav-item" id="admin-logout" style="border:none;width:100%;text-align:left;cursor:pointer;background:none;color:var(--color-error);"><i data-lucide="log-out" width="18" height="18"></i> Logout</button>
        </div>
      </nav>
    </aside>

    <main class="admin-main">
      <div class="admin-topbar">
        <h1 class="admin-page-title">Manage Orders</h1>
        <div style="display:flex; align-items:center; gap:12px;">
          <!-- Light / Dark Mode Toggle -->
          <button type="button" class="navbar-icon-btn theme-toggle-btn" onclick="toggleTheme()" title="Toggle Light/Dark Theme" style="cursor:pointer; background:var(--color-surface); border:1px solid var(--color-border); width:40px; height:40px; border-radius:var(--radius-lg); display:flex; align-items:center; justify-content:center;">
            <i data-lucide="sun" class="theme-icon-sun" width="18" height="18" style="color:var(--color-gold);"></i>
            <i data-lucide="moon" class="theme-icon-moon" width="18" height="18" style="display:none; color:var(--color-text-muted);"></i>
          </button>
          <select class="form-control" style="width:160px;" id="status-filter" onchange="filterOrders()">
            <option value="">All Statuses</option>
            <option value="pending">Pending</option>
            <option value="processing">Processing</option>
            <option value="shipped">Shipped</option>
            <option value="delivered">Delivered</option>
            <option value="cancelled">Cancelled</option>
          </select>
        </div>
      </div>

      <!-- Status tabs -->
      <div class="filter-chips" style="margin-bottom:var(--space-6);">
        <button class="chip active" onclick="setStatusTab('', this)">All</button>
        <button class="chip" onclick="setStatusTab('pending', this)">⏳ Pending</button>
        <button class="chip" onclick="setStatusTab('processing', this)">🔄 Processing</button>
        <button class="chip" onclick="setStatusTab('shipped', this)">🚚 Shipped</button>
        <button class="chip" onclick="setStatusTab('delivered', this)">✅ Delivered</button>
        <button class="chip" onclick="setStatusTab('cancelled', this)">❌ Cancelled</button>
      </div>

      <div class="data-table-wrapper">
        <table class="data-table">
          <thead>
            <tr>
              <th>Order ID</th>
              <th>Customer</th>
              <th>Items</th>
              <th>Total</th>
              <th>Date</th>
              <th>Status</th>
              <th>Update Status</th>
              <th style="text-align:center;">Actions</th>
            </tr>
          </thead>
          <tbody id="orders-tbody">
            <tr><td colspan="7" style="padding:40px; text-align:center;"><div class="skeleton skeleton-text" style="width:50%;margin:0 auto;"></div></td></tr>
          </tbody>
        </table>
      </div>
    </main>
  </div>

  <script type="module">
    import { getAllOrders, updateOrderStatus, deleteOrder, ORDER_STATUSES } from '../../js/orders.js?v=16';
    import { logoutUser } from '../../js/auth.js';

    lucide.createIcons();

    let allOrders = [];
    let currentFilter = '';

    const demoOrders = [
      { id:'ORD-001234', userName:'Ayesha Fernando', userEmail:'ayesha@email.com', items:[{name:'Floral Dress'},{name:'Leather Bag'}], total:11700, createdAt:{toDate:()=>new Date('2026-08-01')}, status:'delivered' },
      { id:'ORD-001187', userName:'Kasun Perera',    userEmail:'kasun@email.com',  items:[{name:'Oxford Shirt'}], total:3800, createdAt:{toDate:()=>new Date('2026-08-15')}, status:'shipped' },
      { id:'ORD-001056', userName:'Sanduni Silva',   userEmail:'sanduni@email.com', items:[{name:'Evening Blouse'}], total:5200, createdAt:{toDate:()=>new Date('2026-08-25')}, status:'pending' },
      { id:'ORD-000998', userName:'Nimali Dias',     userEmail:'nimali@email.com',  items:[{name:'Gold Necklace'},{name:'Heels'}], total:7300, createdAt:{toDate:()=>new Date('2026-08-20')}, status:'processing' },
    ];

    async function loadOrders() {
      let localPlaced = [];
      try {
        localPlaced = JSON.parse(localStorage.getItem('shenu_placed_orders') || '[]');
      } catch (e) {}

      let overrides = {};
      try {
        overrides = JSON.parse(localStorage.getItem('shenu_order_statuses') || '{}');
      } catch (e) {}

      demoOrders.forEach(o => {
        const clean = (o.id || '').replace(/^#/, '').toUpperCase();
        if (overrides[clean]) o.status = overrides[clean];
        else if (overrides[o.id]) o.status = overrides[o.id];
      });

      try {
        allOrders = await getAllOrders();
        if (allOrders.length === 0) {
          allOrders = [...localPlaced, ...demoOrders];
        } else {
          demoOrders.forEach(d => {
            if (!allOrders.some(o => (o.id || '').replace(/^#/, '').toUpperCase() === d.id.toUpperCase())) {
              allOrders.push(d);
            }
          });
        }
      } catch {
        allOrders = [...localPlaced, ...demoOrders];
      }

      let deleted = [];
      try {
        deleted = JSON.parse(localStorage.getItem('shenu_deleted_orders') || '[]');
      } catch (e) {}

      allOrders = allOrders.filter(o => {
        const clean = (o.id || '').replace(/^#/, '').toUpperCase();
        return !deleted.includes(clean) && !deleted.includes(o.id);
      });

      allOrders.forEach(o => {
        const clean = (o.id || '').replace(/^#/, '').toUpperCase();
        if (overrides[clean]) o.status = overrides[clean];
        else if (overrides[o.id]) o.status = overrides[o.id];
      });

      window.allOrders = allOrders;
      try {
        localStorage.setItem('shenu_all_orders', JSON.stringify(allOrders));
      } catch(e) {}

      renderOrders(allOrders);
    }

    function formatItemSummary(items) {
      if (!items) return 'Fashion Item';
      if (typeof items === 'string') return items;
      if (!Array.isArray(items)) {
        if (typeof items === 'object') {
          return items.title || items.name || items.productName || items.productTitle || 'Fashion Item';
        }
        return String(items);
      }
      if (items.length === 0) return 'No items';
      const first = items[0];
      const firstName = (typeof first === 'object') 
        ? (first.title || first.name || first.productTitle || first.productName || 'Fashion Item')
        : String(first);
      return firstName + (items.length > 1 ? ` +${items.length - 1} more` : '');
    }

    function renderOrders(orders) {
      document.getElementById('orders-tbody').innerHTML = orders.length === 0
        ? '<tr><td colspan="8" style="padding:40px;text-align:center;color:var(--color-text-faint);">No orders found</td></tr>'
        : orders.map(o => {
            const info = ORDER_STATUSES[o.status] || { label: o.status, color: '#fff' };
            let date = 'Recent';
            if (o.createdAt?.toDate) {
              date = window.formatDate ? window.formatDate(o.createdAt.toDate()) : o.createdAt.toDate().toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
            } else if (o.createdAt) {
              const d = new Date(o.createdAt);
              if (!isNaN(d.getTime())) {
                date = window.formatDate ? window.formatDate(d) : d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
              }
            }
            const customerName = o.userName || (o.shippingAddress ? `${o.shippingAddress.firstName || ''} ${o.shippingAddress.lastName || ''}`.trim() : '') || 'Customer';
            const customerEmail = o.userEmail || o.shippingAddress?.email || '';
            const itemsSummary = formatItemSummary(o.items);

            return `
              <tr>
                <td style="font-family:var(--font-heading); font-weight:700; color:var(--color-gold);">#${o.id}</td>
                <td>
                  <div style="font-weight:600;font-size:var(--text-sm);">${customerName}</div>
                  <div style="font-size:var(--text-xs);color:var(--color-text-muted);">${customerEmail}</div>
                </td>
                <td style="font-size:var(--text-sm); color:var(--color-text-muted); max-width:220px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;" title="${itemsSummary}">
                  ${itemsSummary}
                </td>
                <td style="font-weight:700; color:var(--color-gold); font-family:var(--font-heading);">Rs. ${(o.total||0).toLocaleString()}</td>
                <td style="font-size:var(--text-sm); color:var(--color-text-muted);">${date}</td>
                <td>${window.statusBadge ? window.statusBadge(o.status) : `<span class="badge">${o.status}</span>`}</td>
                <td>
                  <select class="form-control" style="width:140px; padding:6px 8px; font-size:var(--text-xs);" onchange="changeStatus('${o.id}', this.value)">
                    ${['pending','processing','shipped','delivered','cancelled'].map(s =>
                      `<option value="${s}" ${o.status===s ? 'selected' : ''}>${ORDER_STATUSES[s]?.label || s}</option>`
                    ).join('')}
                  </select>
                </td>
                <td style="text-align:center;">
                  <button type="button" class="btn btn-sm" onclick="confirmDeleteOrder('${o.id}')" title="Delete Order" style="padding:6px 12px; border-radius:var(--radius-md); border:1px solid rgba(239,68,68,0.35); background:rgba(239,68,68,0.08); color:#ef4444; font-size:var(--text-xs); font-weight:600; cursor:pointer; display:inline-flex; align-items:center; gap:5px; transition:all 0.2s ease;">
                    <i data-lucide="trash-2" width="14" height="14"></i> Delete
                  </button>
                </td>
              </tr>
            `;
          }).join('');
      lucide.createIcons();
    }

    window.setStatusTab = (status, btn) => {
      document.querySelectorAll('.filter-chips .chip').forEach(c => c.classList.remove('active'));
      btn.classList.add('active');
      currentFilter = status;
      const filtered = status ? allOrders.filter(o => o.status === status) : allOrders;
      renderOrders(filtered);
    };

    window.filterOrders = () => {
      const status = document.getElementById('status-filter').value;
      const filtered = status ? allOrders.filter(o => o.status === status) : allOrders;
      renderOrders(filtered);
    };

    window.changeStatus = async (orderId, newStatus) => {
      const clean = (orderId || '').replace(/^#/, '').toUpperCase();

      // 1. Immediately update local in-memory order object
      const order = allOrders.find(o => (o.id || '').replace(/^#/, '').toUpperCase() === clean);
      if (order) {
        order.status = newStatus;
      }

      // 2. Persist to localStorage directly so Track Order and My Orders stay 100% in sync
      try {
        const overrides = JSON.parse(localStorage.getItem('shenu_order_statuses') || '{}');
        overrides[clean] = newStatus;
        overrides[orderId] = newStatus;
        localStorage.setItem('shenu_order_statuses', JSON.stringify(overrides));
      } catch (e) {}

      try {
        const placed = JSON.parse(localStorage.getItem('shenu_placed_orders') || '[]');
        const t = placed.find(o => (o.id || '').replace(/^#/, '').toUpperCase() === clean);
        if (t) {
          t.status = newStatus;
          localStorage.setItem('shenu_placed_orders', JSON.stringify(placed));
        }
      } catch (e) {}

      // 3. Trigger background update without letting any permission error block the UI
      try {
        updateOrderStatus(orderId, newStatus).catch(() => {});
      } catch (e) {}

      // 4. Re-render order row immediately with the updated badge color
      window.allOrders = allOrders;
      try {
        localStorage.setItem('shenu_all_orders', JSON.stringify(allOrders));
      } catch(e) {}

      const currentFiltered = currentFilter ? allOrders.filter(o => o.status === currentFilter) : allOrders;
      renderOrders(currentFiltered);

      const label = ORDER_STATUSES[newStatus]?.label || newStatus;
      showToast(`Order #${orderId} status updated to ${label}`, 'success');
    };

    window.confirmDeleteOrder = async (orderId) => {
      if (!orderId) return;
      const ok = confirm(`Are you sure you want to permanently delete order #${orderId}? This cannot be undone.`);
      if (!ok) return;

      const clean = (orderId || '').replace(/^#/, '').toUpperCase();

      // 1. Persist deletion via orders.js
      try {
        await deleteOrder(orderId);
      } catch (e) {}

      // 2. Remove from local in-memory list
      allOrders = allOrders.filter(o => {
        const oid = (o.id || '').replace(/^#/, '').toUpperCase();
        return oid !== clean && oid !== orderId.toUpperCase();
      });

      window.allOrders = allOrders;
      try {
        localStorage.setItem('shenu_all_orders', JSON.stringify(allOrders));
      } catch(e) {}

      // 3. Re-render table
      const filtered = currentFilter ? allOrders.filter(o => o.status === currentFilter) : allOrders;
      renderOrders(filtered);

      if (typeof window.showToast === 'function') {
        showToast(`Order #${orderId} permanently deleted`, 'success');
      }
    };

    document.getElementById('admin-logout')?.addEventListener('click', () => logoutUser());
    loadOrders();
  </script>

  <script src="../../js/app.js?v=25" type="module"></script>
  <script>document.addEventListener('DOMContentLoaded', () => lucide.createIcons());</script>
  <!-- Shenu AI Chatbot Assistant -->
  <script src="../../js/chatbot.js?v=125" type="module"></script>
      <!-- Floating AI Chatbot Button with Character Avatar -->
  <button id="shenu-chat-trigger" title="Chat with Shenu AI Stylist & Track Orders" onclick="window.toggleShenuChat && window.toggleShenuChat()" aria-label="Open Shenu AI Chatbot">
    <img src="../../images/shenu_ai_avatar.png" alt="Shenu AI Stylist" class="trigger-avatar-img" />
    <svg class="icon-close" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <line x1="18" y1="6" x2="6" y2="18"></line>
      <line x1="6" y1="6" x2="18" y2="18"></line>
    </svg>
    <span class="trigger-online-dot"></span>
  </button>
</body>
</html>
