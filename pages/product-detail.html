<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Product Details — Shenu Fashion Store</title>

  <link rel="stylesheet" href="../css/main.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/pages.css" />
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23C9A96E'/><text y='22' x='6' font-size='20' font-family='serif' font-weight='bold' fill='%230F0F1A'>S</text></svg>" />
</head>
<body>

  <div id="toast-container"></div>

  <!-- NAVBAR -->
  <nav class="navbar scrolled" id="main-navbar">
    <div class="navbar-inner">
      <a href="../index.html" class="navbar-logo">
        <div class="navbar-logo-icon">S</div>
        <div class="navbar-logo-text">SHENU <span>FASHION</span></div>
      </a>
      <ul class="navbar-nav">
        <li><a href="../index.html" class="nav-link">Home</a></li>
        <li><a href="products.html" class="nav-link">Products</a></li>
      </ul>
      <div class="navbar-actions">
        <a href="cart.html" class="navbar-icon-btn">
          <i data-lucide="shopping-bag" width="18" height="18"></i>
          <span class="badge-count" id="cart-count-badge" style="display:none">0</span>
        </a>
      </div>
    </div>
  </nav>

  <main style="padding: calc(var(--navbar-height) + var(--space-8)) 0 var(--space-12) 0;">
    <div class="container" style="max-width:1100px;">
      
      <!-- Loading Skeleton -->
      <div id="loading-state" style="display:grid; grid-template-columns:1fr 1fr; gap:var(--space-8);">
        <div class="skeleton" style="height:500px; border-radius:var(--radius-xl);"></div>
        <div style="display:flex; flex-direction:column; gap:var(--space-4);">
          <div class="skeleton" style="height:40px; width:70%;"></div>
          <div class="skeleton" style="height:30px; width:40%;"></div>
          <div class="skeleton" style="height:100px; width:100%;"></div>
        </div>
      </div>

      <!-- Error State -->
      <div id="error-state" class="empty-state" style="display:none; padding:var(--space-12) 0;">
        <div class="empty-state-icon"><i data-lucide="package-x" width="36" height="36"></i></div>
        <div class="empty-state-title">Product Not Found</div>
        <div class="empty-state-description">The product you're looking for doesn't exist or has been removed.</div>
        <a href="products.html" class="btn btn-primary btn-lg" style="margin-top:var(--space-5);">Back to Products</a>
      </div>

      <!-- Product Details Content -->
      <div id="product-content" style="display:none; grid-template-columns:1fr 1fr; gap:var(--space-10); align-items:start;">
        
        <!-- Left: Image -->
        <div style="position:sticky; top:calc(var(--navbar-height) + 20px);">
          <div style="border-radius:var(--radius-2xl); overflow:hidden; border:1px solid var(--color-border); aspect-ratio:3/4; background:var(--color-surface-2);">
            <img id="detail-image" src="" alt="Product" style="width:100%; height:100%; object-fit:cover;" />
          </div>
        </div>

        <!-- Right: Info -->
        <div style="display:flex; flex-direction:column; gap:var(--space-6);">
          
          <div>
            <div id="detail-category" style="font-family:var(--font-heading); color:var(--color-gold); font-size:var(--text-sm); font-weight:700; text-transform:uppercase; letter-spacing:0.1em; margin-bottom:8px;"></div>
            <h1 id="detail-name" style="font-family:var(--font-heading); font-size:42px; font-weight:800; line-height:1.1; margin-bottom:12px;"></h1>
            
            <div style="display:flex; align-items:center; gap:12px;">
              <div id="detail-price" style="font-family:var(--font-heading); font-size:32px; font-weight:700; color:var(--color-gold);"></div>
              <div id="detail-old-price" style="font-size:var(--text-lg); color:var(--color-text-muted); text-decoration:line-through;"></div>
            </div>
          </div>

          <div id="detail-description" style="color:var(--color-text-faint); font-size:var(--text-base); line-height:1.6;"></div>

          <div style="height:1px; background:var(--color-border); margin:var(--space-2) 0;"></div>

          <!-- Options -->
          <div style="display:flex; flex-direction:column; gap:var(--space-6);">
            
            <!-- Size -->
            <div id="size-section" style="display:none;">
              <div style="font-weight:600; font-size:var(--text-sm); margin-bottom:12px; display:flex; justify-content:space-between;">
                <span>Select Size</span>
                <span style="color:var(--color-gold); text-decoration:underline; cursor:pointer;">Size Guide</span>
              </div>
              <div id="size-options" style="display:flex; flex-wrap:wrap; gap:10px;"></div>
            </div>

            <!-- Color -->
            <div id="color-section" style="display:none;">
              <div style="font-weight:600; font-size:var(--text-sm); margin-bottom:12px;">Select Color</div>
              <div id="color-options" style="display:flex; flex-wrap:wrap; gap:12px;"></div>
            </div>

            <!-- Quantity -->
            <div>
              <div style="font-weight:600; font-size:var(--text-sm); margin-bottom:12px;">Quantity</div>
              <div class="quantity-control" style="width:fit-content; background:var(--color-surface); border:1px solid var(--color-border); padding:4px;">
                <button class="qty-btn" onclick="updateDetailQty(-1)">−</button>
                <span class="qty-value" id="detail-qty" style="width:40px;">1</span>
                <button class="qty-btn" onclick="updateDetailQty(1)">+</button>
              </div>
            </div>

          </div>

          <!-- Actions -->
          <div style="display:flex; gap:16px; margin-top:var(--space-4);">
            <button class="btn btn-primary btn-lg" id="add-to-cart-btn" style="flex:1; height:56px;" onclick="addDetailToCart()">
              <i data-lucide="shopping-cart" width="20" height="20"></i>
              Add to Cart
            </button>
            <button class="btn btn-outline btn-lg" style="width:56px; height:56px; padding:0; flex-shrink:0;">
              <i data-lucide="heart" width="22" height="22"></i>
            </button>
          </div>

        </div>
      </div>

    </div>
  </main>

  <script src="../js/app.js" type="module"></script>
  <script type="module">
    import { getProduct } from '../js/products.js';
    import { addToCart } from '../js/cart.js';

    lucide.createIcons();

    let currentProduct = null;
    let selectedSize = null;
    let selectedColor = null;
    let selectedQty = 1;

    async function init() {
      const urlParams = new URLSearchParams(window.location.search);
      const productId = urlParams.get('id');

      if (!productId) {
        showError();
        return;
      }

      const product = await getProduct(productId);
      if (!product) {
        showError();
        return;
      }

      currentProduct = product;
      renderProductDetails(product);
    }

    function showError() {
      document.getElementById('loading-state').style.display = 'none';
      document.getElementById('error-state').style.display = 'flex';
    }

    function renderProductDetails(p) {
      document.getElementById('loading-state').style.display = 'none';
      document.getElementById('product-content').style.display = 'grid';

      // Image
      const imgUrl = p.images?.[0] || 'https://via.placeholder.com/600';
      document.getElementById('detail-image').src = imgUrl;

      // Info
      document.getElementById('detail-category').textContent = p.category || '';
      document.getElementById('detail-name').textContent = p.name;
      
      const price = p.salePrice || p.price || 0;
      document.getElementById('detail-price').textContent = window.formatCurrency(price);
      if (p.salePrice) {
        document.getElementById('detail-old-price').textContent = window.formatCurrency(p.price);
      }

      document.getElementById('detail-description').textContent = p.description || 'No description available for this product.';

      // Sizes
      if (p.sizes && p.sizes.length > 0) {
        document.getElementById('size-section').style.display = 'block';
        selectedSize = p.sizes[0];
        document.getElementById('size-options').innerHTML = p.sizes.map(size => `
          <div class="size-btn ${size === selectedSize ? 'selected' : ''}" onclick="window.selectSize('${size}', this)">${size}</div>
        `).join('');
      }

      // Colors
      if (p.colors && p.colors.length > 0) {
        document.getElementById('color-section').style.display = 'block';
        selectedColor = p.colors[0];
        
        // Basic mapping for preview colors
        const colorMap = {
          'Black':'#1a1a1a', 'White':'#f0f0f0', 'Red':'#E94560', 'Blue':'#3B82F6', 
          'Green':'#4CAF6E', 'Gold':'#C9A96E', 'Pink':'#F472B6', 'Navy':'#1E3A5F'
        };

        document.getElementById('color-options').innerHTML = p.colors.map(color => {
          const hex = colorMap[color] || '#555';
          return `
            <div class="color-dot ${color === selectedColor ? 'selected' : ''}" 
                 style="background:${hex}; width:32px; height:32px;" 
                 title="${color}"
                 onclick="window.selectColor('${color}', this)"></div>
          `;
        }).join('');
      }
    }

    window.selectSize = (size, el) => {
      selectedSize = size;
      document.querySelectorAll('.size-btn').forEach(b => b.classList.remove('selected'));
      el.classList.add('selected');
    };

    window.selectColor = (color, el) => {
      selectedColor = color;
      document.querySelectorAll('.color-dot').forEach(b => b.classList.remove('selected'));
      el.classList.add('selected');
    };

    window.updateDetailQty = (delta) => {
      selectedQty = Math.max(1, selectedQty + delta);
      document.getElementById('detail-qty').textContent = selectedQty;
    };

    window.addDetailToCart = () => {
      if (!currentProduct) return;
      addToCart(currentProduct.id, selectedQty, selectedSize, selectedColor);
      
      const btn = document.getElementById('add-to-cart-btn');
      const origText = btn.innerHTML;
      btn.innerHTML = `<i data-lucide="check" width="20" height="20"></i> Added`;
      btn.style.background = 'var(--color-success)';
      btn.style.borderColor = 'var(--color-success)';
      lucide.createIcons();
      
      showToast(`${currentProduct.name} added to cart!`, 'success');
      
      setTimeout(() => {
        btn.innerHTML = origText;
        btn.style.background = '';
        btn.style.borderColor = '';
        lucide.createIcons();
      }, 2000);
    };

    init();
  </script>
</body>
</html>
