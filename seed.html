<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Seed Database (Full Catalog)</title>
  <style>
    body { background: #1A1A2E; color: #fff; font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
    .card { background: #252540; padding: 40px; border-radius: 12px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); max-width: 500px;}
    button { background: #C9A96E; border: none; padding: 12px 24px; font-size: 16px; border-radius: 6px; cursor: pointer; color: #1A1A2E; font-weight: bold; margin-top: 20px; width: 100%;}
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .progress-bar { width: 100%; background: #1A1A2E; height: 10px; border-radius: 5px; margin-top: 20px; overflow: hidden; display: none;}
    .progress-fill { height: 100%; background: #4ade80; width: 0%; transition: width 0.1s; }
  </style>
</head>
<body>

  <div class="card">
    <h2>Populate Full Catalog</h2>
    <p>Click below to generate exactly the amounts shown in the filters (142 Women, 98 Men, 76 Dresses, 54 Accessories, 67 Shoes, 43 Bags) = 480 Products.</p>
    <button id="seedBtn">Generate 480 Real Products</button>
    <div class="progress-bar" id="progressBar"><div class="progress-fill" id="progressFill"></div></div>
    <div id="status" style="margin-top: 20px; color: #4ade80;"></div>
  </div>

  <script type="module">
    import { db } from './js/firebase-config.js';
    import { collection, addDoc, serverTimestamp, writeBatch, doc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    // Reusable image pools by category
    const images = {
      women: ['https://images.unsplash.com/photo-1595777457583-95e059d581b8?w=800&q=80', 'https://images.unsplash.com/photo-1434389670869-c44943f2d7ac?w=800&q=80', 'https://images.unsplash.com/photo-1515886657613-9f3515b0c78f?w=800&q=80', 'https://images.unsplash.com/photo-1503342217505-b0a15ec3261c?w=800&q=80', 'https://images.unsplash.com/photo-1551163943-3f6a855d1153?w=800&q=80'],
      men: ['https://images.unsplash.com/photo-1596755094514-f87e34085b2c?w=800&q=80', 'https://images.unsplash.com/photo-1617137984095-74e4e5e3613f?w=800&q=80', 'https://images.unsplash.com/photo-1495105787522-5334e3ffa0ef?w=800&q=80', 'https://images.unsplash.com/photo-1616648714041-39626e2e542d?w=800&q=80', 'https://images.unsplash.com/photo-1507680434267-3256241a12e6?w=800&q=80'],
      dresses: ['https://images.unsplash.com/photo-1572804013309-59a88b7e92f1?w=800&q=80', 'https://images.unsplash.com/photo-1595777457583-95e059d581b8?w=800&q=80', 'https://images.unsplash.com/photo-1539008835657-9e8e9680c956?w=800&q=80', 'https://images.unsplash.com/photo-1566150905458-1bf1fc113f0d?w=800&q=80'],
      accessories: ['https://images.unsplash.com/photo-1599643478514-4a820c5678eb?w=800&q=80', 'https://images.unsplash.com/photo-1511499767150-a48a237f0083?w=800&q=80', 'https://images.unsplash.com/photo-1606760227091-3dd870d97f1d?w=800&q=80', 'https://images.unsplash.com/photo-1535632066927-ab7c9ab60908?w=800&q=80'],
      shoes: ['https://images.unsplash.com/photo-1543163521-1bf539c55dd2?w=800&q=80', 'https://images.unsplash.com/photo-1549298916-b41d501d3772?w=800&q=80', 'https://images.unsplash.com/photo-1600185365483-26d7a4cc7519?w=800&q=80', 'https://images.unsplash.com/photo-1560769629-975ec94e6a86?w=800&q=80', 'https://images.unsplash.com/photo-1595950653106-6c9ebd614d3a?w=800&q=80'],
      bags: ['https://images.unsplash.com/photo-1550614000-4b95dd247545?w=800&q=80', 'https://images.unsplash.com/photo-1584916201218-f4242ceb4809?w=800&q=80', 'https://images.unsplash.com/photo-1591561954557-26941169b49e?w=800&q=80', 'https://images.unsplash.com/photo-1598532163257-ae3c6b2524b6?w=800&q=80']
    };

    const config = [
      { name: 'Women', count: 142, prefixes: ['Elegant', 'Casual', 'Summer', 'Designer', 'Chic'], items: ['Blouse', 'Top', 'Skirt', 'Jeans', 'Jacket'] },
      { name: 'Men', count: 98, prefixes: ['Classic', 'Urban', 'Formal', 'Casual', 'Sport'], items: ['Shirt', 'T-Shirt', 'Trousers', 'Jacket', 'Hoodie'] },
      { name: 'Dresses', count: 76, prefixes: ['Floral', 'Evening', 'Cocktail', 'Maxi', 'Boho'], items: ['Dress', 'Gown', 'Sundress'] },
      { name: 'Accessories', count: 54, prefixes: ['Gold', 'Silver', 'Vintage', 'Modern', 'Minimalist'], items: ['Necklace', 'Watch', 'Bracelet', 'Sunglasses', 'Belt'] },
      { name: 'Shoes', count: 67, prefixes: ['Leather', 'Comfort', 'Sport', 'Formal', 'Casual'], items: ['Sneakers', 'Heels', 'Boots', 'Loafers', 'Sandals'] },
      { name: 'Bags', count: 43, prefixes: ['Leather', 'Canvas', 'Designer', 'Travel', 'Everyday'], items: ['Tote', 'Crossbody', 'Backpack', 'Clutch'] }
    ];

    function getRandomItem(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
    function getRandomPrice() { return Math.floor(Math.random() * 150 + 20) * 100; } // 2000 to 17000
    function getRandomRating() { return (Math.random() * 1.5 + 3.5).toFixed(1); } // 3.5 to 5.0

    document.getElementById('seedBtn').addEventListener('click', async () => {
      const btn = document.getElementById('seedBtn');
      const status = document.getElementById('status');
      const progressBar = document.getElementById('progressBar');
      const progressFill = document.getElementById('progressFill');
      
      btn.disabled = true;
      progressBar.style.display = 'block';
      let added = 0;
      const total = 480;

      try {
        const colRef = collection(db, 'products');
        
        // Use batches of 50 to speed it up significantly
        let batches = [];
        let currentBatch = writeBatch(db);
        let batchCount = 0;

        for (const cat of config) {
          const imgPool = images[cat.name.toLowerCase()];
          
          for (let i = 0; i < cat.count; i++) {
            const isSale = Math.random() > 0.7;
            const price = getRandomPrice();
            
            const product = {
              name: `${getRandomItem(cat.prefixes)} ${getRandomItem(cat.items)}`,
              category: cat.name,
              price: price,
              salePrice: isSale ? Math.floor(price * 0.8) : null,
              stock: Math.floor(Math.random() * 50) + 1,
              rating: parseFloat(getRandomRating()),
              reviewCount: Math.floor(Math.random() * 200),
              isNew: Math.random() > 0.8,
              onSale: isSale,
              images: [getRandomItem(imgPool)],
              createdAt: serverTimestamp(),
              sizes: ['S', 'M', 'L'].filter(() => Math.random() > 0.3)
            };

            const docRef = doc(colRef);
            currentBatch.set(docRef, product);
            batchCount++;
            added++;

            if (batchCount === 500 || added === total) {
              batches.push(currentBatch.commit());
              currentBatch = writeBatch(db);
              batchCount = 0;
              progressFill.style.width = `${(added / total) * 100}%`;
              status.textContent = `Generated ${added} / ${total} products...`;
            }
          }
        }
        
        await Promise.all(batches);
        
        status.textContent = '✅ Success! 480 products with images fully added to your database.';
        btn.textContent = 'Done!';
        setTimeout(() => window.location.href = 'pages/products.html', 3000);
      } catch (err) {
        console.error(err);
        status.style.color = '#ef4444';
        status.textContent = '❌ Error: ' + err.message;
        btn.disabled = false;
        btn.textContent = 'Try Again';
      }
    });
  </script>
</body>
</html>
